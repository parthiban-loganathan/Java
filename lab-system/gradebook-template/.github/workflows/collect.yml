name: Collect and grade

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Only exercises of this week number (leave empty for all)'
        required: false
        default: ''
      exercises:
        description: 'Only these exercise IDs, separated by spaces (leave empty for all)'
        required: false
        default: ''
  schedule:
    # every Monday 00:05 IST (Sunday 18:35 UTC): snapshot of the work at the weekly deadline
    - cron: '35 18 * * 0'
  push:
    paths: ['marks.csv', 'roster.csv', 'assignments.csv']

permissions:
  contents: write

concurrency:
  group: gradebook
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Get Java 21
        run: docker pull -q eclipse-temurin:21-jdk
      - name: Collect, grade (isolated containers) and build the gradebook
        env:
          STUDENT_REPOS_TOKEN: ${{ secrets.STUDENT_REPOS_TOKEN }}
          WEEK: ${{ github.event.inputs.week }}
          EXERCISES: ${{ github.event.inputs.exercises }}
        run: |
          args="--discover"
          if [ -n "$WEEK" ]; then args="$args --week $WEEK"; fi
          if [ -n "$EXERCISES" ]; then args="$args --only $EXERCISES"; fi
          python3 grader/collect.py $args
      - name: Save archive and gradebook
        run: |
          git config user.name "gradebook"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A archive latest gradebook roster.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Collection $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1

  rebuild:
    # after you edit marks.csv, roster.csv or assignments.csv: recompute the gradebook only
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 grader/collect.py --gradebook-only
      - run: |
          git config user.name "gradebook"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gradebook
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Gradebook update"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
