name: Collect and mark lab submissions

# Teacher: Actions -> Collect and mark lab submissions -> Run workflow (after closing a session).
# Reads the Lab submission issues of the public lab repository, decrypts them with the secrets
# LAB_PRIVATE_KEY and LAB_KEY_PASSPHRASE, marks the last accepted submission of every student with the hidden tests in
# tests/ (each program in an isolated container without network), and saves everything in results/.
on:
  workflow_dispatch:
    inputs:
      session:
        description: Session to collect, e.g. W05 (empty = all sessions)
        required: false
        default: ''
  push:
    paths: ['roster.csv', 'tests/**']

permissions:
  contents: write

concurrency:
  group: gradebook
  cancel-in-progress: false

env:
  LAB_REPOSITORY: parthiban-loganathan/Java   # the public lab repository

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Lab tools (from the public lab repository)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LAB_REPOSITORY }}
          path: .lab-public
          sparse-checkout: |
            tools/lab
            lab-system/grader
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q cryptography==46.0.3
      - name: Java 21 and MySQL 8.4 for marking, MySQL Connector/J (checksum verified)
        run: |
          docker pull -q eclipse-temurin:21-jdk
          docker pull -q mysql:8.4
          curl -fsSL --retry 5 -o mysql-connector-j.jar \
            https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/9.1.0/mysql-connector-j-9.1.0.jar
          echo "8776e2ebc46072c9a47ea59d98298c4273bd9f16a7b26b5dfa4744535aa26c62  mysql-connector-j.jar" | sha256sum -c -
      - name: Collect, decrypt, mark
        env:
          LAB_PRIVATE_KEY: ${{ secrets.LAB_PRIVATE_KEY }}
          LAB_KEY_PASSPHRASE: ${{ secrets.LAB_KEY_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
          SESSION: ${{ github.event.inputs.session }}
        run: |
          python3 .lab-public/tools/lab/collect_lab.py --repo "$LAB_REPOSITORY" --session "$SESSION" \
            --tests tests --roster roster.csv --out results --jdbc-jar mysql-connector-j.jar
      - name: Save results
        run: |
          git config user.name "gradebook"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Lab results $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((i * 3))
          done
          exit 1
