name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-and-site:
    name: Java tests, course check, browser check, site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate project directory and problem bank
        run: |
          python3 tools/validate_projects.py
          python3 tools/render_problem_bank.py --check
      - name: Build site (core unit tests, TeaVM, course files, starter template)
        run: bash tools/build-site.sh build/site
      - name: Course programs on the JDK (expected outputs)
        run: java tools/CourseCheck.java
      - name: Course programs in the browser build vs JDK
        run: node tools/verification/browser_course_check.mjs java/web-bridge/target/js/civiltech.js course
      - name: Hydrology in the browser build
        run: node tools/verification/browser_hydrology_check.mjs java/web-bridge/target/js/civiltech.js site/data/catchment
      - name: Same hydrology on the JVM
        run: java -cp java/civiltech-core/target/classes civiltech.lab.Cli site/data/catchment/vellore_hills_grid.json site/data/catchment/era5_vellore_hourly.csv --from 312 --hours 96 | head -2
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/site
          retention-days: 7

  lab-grader:
    name: Weekly lab grader in Docker (correct, wrong, broken and hostile programs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker pull -q eclipse-temurin:21-jdk
      - name: Build test lab from the course solutions and broken samples
        run: bash lab-system/selftest/make_samples.sh /tmp/selftest
      - name: Grade in isolated containers
        run: python3 lab-system/grader/grade.py --lab /tmp/selftest/lab --tests /tmp/selftest/tests --out /tmp/selftest/results --timeout 5
      - name: Check the grades are what they must be
        run: python3 lab-system/selftest/verify.py /tmp/selftest/results

  browser-javac:
    name: In-browser Java compiler (build from source, run every course program in Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the lab's class-library additions
        run: mvn -B -q -f java/pom.xml install -DskipTests
      - name: Cache the compiler
        id: cache
        uses: actions/cache@v4
        with:
          path: javac-dist
          key: browser-javac-${{ hashFiles('tools/browser-javac/build.sh', 'java/teavm-patches/src/**') }}
      - name: Build teavm-javac from source (OpenJDK 25 javac + TeaVM to WebAssembly)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JAVA25_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: bash tools/browser-javac/build.sh javac-dist
      - uses: actions/upload-artifact@v4
        with:
          name: browser-javac
          path: javac-dist
          retention-days: 30
      - name: Build the site with the compiler
        env:
          SKIP_TESTS: 'true'
          JAVAC_DIST: javac-dist
        run: bash tools/build-site.sh build/site
      - name: Compile and run every course program in Chromium
        run: |
          npm install --no-save --silent playwright@1.63.0
          npx playwright install --with-deps chromium > /dev/null
          (cd build/site && python3 -m http.server 8765 > /dev/null 2>&1 &)
          sleep 2
          node tools/verification/browser_javac_check.mjs http://localhost:8765/ course javac-report.md
      - name: Report
        if: always()
        run: cat javac-report.md >> "$GITHUB_STEP_SUMMARY" || true

  jdbc-experiment:
    name: Experiment 16 with a real MySQL server
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Create database and table (setup.sql)
        run: mysql -h 127.0.0.1 -uroot -ppassword < course/experiments/E16-employee-jdbc/setup.sql
      - name: Download MySQL Connector/J
        run: |
          mkdir -p lib
          curl -fsSL -o lib/mysql-connector-j-9.1.0.jar https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/9.1.0/mysql-connector-j-9.1.0.jar
      - name: Run EmployeeApp with the scripted input
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/company_db
          DB_USER: root
          DB_PASSWORD: password
        run: java tools/CourseCheck.java --mysql --only E16 --cp "lib/mysql-connector-j-9.1.0.jar"

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
